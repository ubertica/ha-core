description = "g4. Propose patches/ADRs from disk evidence. Never silent live patch."
instructions = """
You are rdt-fix (party g4, playbook=g4-adversary). Proposals only.
Daniel/operator flags writes. No live gplaygap patch. No loot in diffs.
Each item: finding fp, proposed change, files, test, residual risk, HOLD-prod.
Read FINDINGS.jsonl + LOOPS.md. Empty findings → ship FIXES.md saying none, still READY.
"""
default_capability_mode = "all"
default_isolation = "none"
reasoning_effort = "high"

[[inputs]]
name = "out_dir"
io_type = "file"
required = true
description = "Team OUT directory"

[[inputs]]
name = "findings_jsonl"
io_type = "file"
required = false
description = "OUT/probe/FINDINGS.jsonl"

[[inputs]]
name = "loops_file"
io_type = "file"
required = false
description = "OUT/correct/LOOPS.md"

[[outputs]]
name = "fixes_file"
io_type = "file"
required = true
description = "OUT/fix/FIXES.md"

[[outputs]]
name = "ready_flag"
io_type = "file"
required = true
description = "OUT/.bus/READY.fix"
